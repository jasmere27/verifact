<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0f1d" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="VeriFact checks claims in text, links, images and short audio clips against published sources, showing which sources support or contradict each claim and what remains uncertain."
    />
    <!-- Link previews. functions/r/[id].ts rewrites these for shared /r/{id} reports. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VeriFact" />
    <meta property="og:title" content="VeriFact — Verify Truth, Fight the False" />
    <meta
      property="og:description"
      content="Paste a post, a link or a screenshot and see what fact-checkers, news and reference sources say."
    />
    <meta property="og:url" content="https://verifact-blf.pages.dev/" />
    <meta property="og:image" content="/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VeriFact — Verify Truth, Fight the False" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VeriFact — Verify Truth, Fight the False" />
    <meta
      name="twitter:description"
      content="Paste a post, a link or a screenshot and see what fact-checkers, news and reference sources say."
    />
    <meta name="twitter:image" content="/og/default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Sora:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <!-- Applies a saved Light/Dark choice before first paint (a file, not inline, so the CSP can forbid inline scripts). -->
    <script src="/theme-init.js"></script>
    <title>VeriFact — Verify Truth, Fight the False</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
