services:
  - type: web
    name: verifact-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: OPEN_AI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Legacy search (discontinued 2027-01-01); optional once TAVILY_API_KEY is set
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      # Render's proxy appends the client IP to X-Forwarded-For; needed for per-IP rate limits.
      - key: TRUST_FORWARDED_FOR
        value: "true"
