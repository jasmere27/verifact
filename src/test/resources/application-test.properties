# H2 stands in for Postgres in tests. The TIMESTAMPTZ domain lets the Postgres-flavoured
# Flyway migrations run unchanged.
spring.datasource.url=jdbc:h2:mem:verifact;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
spring.datasource.username=sa
spring.datasource.password=
OPEN_AI_API_KEY=test-key
GOOGLE_API_KEY=test-key
GOOGLE_SEARCH_ENGINE=test-engine
app.monitoring.scheduler-enabled=false
app.investigations.sweep-millis=3600000
app.rate-limit.workspace-writes-per-ip-per-minute=100000
