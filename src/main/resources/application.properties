spring.application.name=verifact
# Hosting platforms (e.g. Render) may provide PORT.
server.port=${PORT:8080}

# --- AI provider ---
spring.ai.openai.api-key=${OPEN_AI_API_KEY}
# Model: set SPRING_AI_OPENAI_CHAT_MODEL to override the Spring AI default.
# Bound retries and time per call: each retry is another paid request.
spring.ai.openai.max-retries=1
spring.ai.openai.chat.timeout=60s

# --- Outbound HTTP via Spring's RestClient builder (search providers) ---
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=15s

# --- Web search ---
# tavily | google | auto (auto = Tavily if TAVILY_API_KEY is set, else Google if its keys are set)
app.search.provider=${SEARCH_PROVIDER:auto}
app.search.max-results=6
tavily.api-key=${TAVILY_API_KEY:}
# Legacy: Google Custom Search is discontinued on 2027-01-01.
google.api.key=${GOOGLE_API_KEY:}
google.cse.id=${GOOGLE_SEARCH_ENGINE:}

# --- Uploads (Google Speech sync API accepts at most 10 MB) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- Supabase Postgres ---
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# db/vendor/postgresql holds Postgres-only migrations (row-level security); tests run on H2 without them.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

# --- Accounts (Supabase Auth; ADR-18) ---
# Project URL, e.g. https://abcd1234.supabase.co. Blank = accounts off (every token rejected; signed-out use unaffected).
app.auth.supabase-url=${SUPABASE_URL:}
# Supabase secret key (sb_secret_...), backend only: account deletion. Blank = deletion unavailable (503).
app.auth.supabase-secret-key=${SUPABASE_SECRET_KEY:}

# --- CORS ---
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173,http://localhost:3000}

# --- Abuse and cost limits ---
app.input.max-chars=${MAX_INPUT_CHARS:10000}
app.ai.max-content-chars=${MAX_CONTENT_CHARS:20000}
# Reasoning effort for simple steps checked in code (ResearchFact discovery). Blank = model default.
app.ai.quick-reasoning-effort=${AI_QUICK_REASONING_EFFORT:low}
# Reuse a report for the same text/link checked within this many hours (0 disables reuse).
app.reuse.ttl-hours=${REUSE_TTL_HOURS:24}
app.rate-limit.feedback-per-ip-per-minute=${RATE_LIMIT_FEEDBACK_PER_IP_PER_MINUTE:20}
app.rate-limit.per-ip-per-minute=${RATE_LIMIT_PER_IP_PER_MINUTE:5}
app.rate-limit.per-ip-per-day=${RATE_LIMIT_PER_IP_PER_DAY:50}
app.rate-limit.global-per-day=${RATE_LIMIT_GLOBAL_PER_DAY:1000}
# Set to true only when running behind a reverse proxy that appends X-Forwarded-For (e.g. Render).
app.rate-limit.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

# --- URL fetching ---
app.fetch.timeout-millis=10000
app.fetch.max-body-bytes=2000000

# --- History API: exposes all submissions, so off unless explicitly enabled (local dev only) ---
app.history.enabled=${HISTORY_API_ENABLED:false}

# --- ResearchFact scholarly indexes (Crossref + OpenAlex; both work without keys) ---
# Contact email for Crossref's polite pool (faster, more reliable) and the User-Agent.
app.research.contact-email=${SCHOLARLY_CONTACT_EMAIL:}
# Optional OpenAlex key: raises the free daily budget (related-work searches cost $0.001 each).
app.research.openalex-api-key=${OPENALEX_API_KEY:}

# --- Images ---
# A vision model reads uploads (text, visible context, claims); Tesseract OCR is the fallback.
# false = OCR only (the configured chat model must accept images when true).
app.vision.enabled=${VISION_ENABLED:true}
tesseract.datapath=${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}

# --- Health check (cheap; no AI or search calls) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Persistence is best-effort, so a database blip must not make the host restart the service.
management.health.db.enabled=false

# --- Logging ---
logging.pattern.level=%5p [%X{requestId:-}]

# NewsFact supporting videos (YouTube Data API v3). Blank = video search off.
app.youtube.api-key=${YOUTUBE_API_KEY:}
# Claims per story that get a video search (each costs one of ~100 daily YouTube searches).
app.news.video-claims=${NEWS_VIDEO_CLAIMS:4}

# --- VeriFact Intelligence (ADR-26) ---
# Monitoring scheduler: checks for due projects every minute while the service is up.
app.monitoring.scheduler-enabled=${MONITORING_SCHEDULER_ENABLED:true}
# Search queries per connector per run (each is one Tavily credit).
app.monitoring.max-queries-per-connector=${MONITORING_MAX_QUERIES:4}
app.monitoring.concurrency=2
# Shared secret for POST /api/v2/internal/monitoring/tick (external cron for hosts that sleep). Blank = endpoint off.
app.monitoring.cron-secret=${MONITORING_CRON_SECRET:}
app.investigations.concurrency=2
# YouTube monitoring (uses YOUTUBE_API_KEY). Each search = 100 of the key's ~10,000 daily units, shared with NewsFact
# videos, so monitoring gets its own daily budget of searches (UTC day, all workspaces together).
app.monitoring.youtube.daily-searches=${MONITORING_YOUTUBE_DAILY_SEARCHES:40}
app.monitoring.youtube.queries-per-run=1
app.monitoring.youtube.results-per-query=10

# Plans: prices (USD/month) and monthly quotas. Hypotheses to validate; change here, not in code.
# provider-price-id = the Paddle price (pri_...) used at checkout; blank = the plan can't be bought online yet.
app.billing.trial-plan=intelligence
app.billing.trial-days=${BILLING_TRIAL_DAYS:14}
app.billing.plans.monitor.name=Monitor
app.billing.plans.monitor.price-usd-monthly=49
app.billing.plans.monitor.summary=One brand, scheduled monitoring, basic investigations, monthly reports.
app.billing.plans.monitor.max-projects=1
app.billing.plans.monitor.max-terms-per-project=15
app.billing.plans.monitor.min-check-interval-hours=24
app.billing.plans.monitor.monitoring-runs-per-month=62
app.billing.plans.monitor.investigations-per-month=20
app.billing.plans.monitor.response-drafts-per-month=0
app.billing.plans.monitor.reports-per-month=2
app.billing.plans.monitor.seats=1
app.billing.plans.monitor.max-rss-feeds-per-project=2
app.billing.plans.monitor.provider-price-id=${PADDLE_PRICE_MONITOR:}
app.billing.plans.intelligence.name=Intelligence
app.billing.plans.intelligence.price-usd-monthly=149
app.billing.plans.intelligence.summary=Several projects, more checks, incident workflows, Response Studio, team access.
app.billing.plans.intelligence.max-projects=5
app.billing.plans.intelligence.max-terms-per-project=40
app.billing.plans.intelligence.min-check-interval-hours=6
app.billing.plans.intelligence.monitoring-runs-per-month=800
app.billing.plans.intelligence.investigations-per-month=100
app.billing.plans.intelligence.response-drafts-per-month=100
app.billing.plans.intelligence.reports-per-month=10
app.billing.plans.intelligence.seats=5
app.billing.plans.intelligence.max-rss-feeds-per-project=10
app.billing.plans.intelligence.provider-price-id=${PADDLE_PRICE_INTELLIGENCE:}
app.billing.plans.business.name=Business
app.billing.plans.business.price-usd-monthly=399
app.billing.plans.business.summary=Multiple brands and clients, higher limits, shared investigations, advanced reporting.
app.billing.plans.business.max-projects=20
app.billing.plans.business.max-terms-per-project=80
app.billing.plans.business.min-check-interval-hours=2
app.billing.plans.business.monitoring-runs-per-month=3000
app.billing.plans.business.investigations-per-month=400
app.billing.plans.business.response-drafts-per-month=400
app.billing.plans.business.reports-per-month=40
app.billing.plans.business.seats=15
app.billing.plans.business.max-rss-feeds-per-project=25
app.billing.plans.business.provider-price-id=${PADDLE_PRICE_BUSINESS:}

# Paddle Billing (merchant of record). Sandbox by default; live: https://api.paddle.com. Blank key/secret = online payment off.
app.billing.paddle.api-base=${PADDLE_API_BASE:https://sandbox-api.paddle.com}
app.billing.paddle.api-key=${PADDLE_API_KEY:}
app.billing.paddle.webhook-secret=${PADDLE_WEBHOOK_SECRET:}
app.billing.paddle.signature-tolerance-seconds=300
