spring.application.name=verifact
# Hosting platforms (e.g. Render) may provide PORT.
server.port=${PORT:8080}

# --- AI provider ---
spring.ai.openai.api-key=${OPEN_AI_API_KEY}
# Model: set SPRING_AI_OPENAI_CHAT_MODEL to override the Spring AI default.
# Bound retries and time per call: each retry is another paid request.
spring.ai.openai.max-retries=1
spring.ai.openai.chat.timeout=60s

# --- Outbound HTTP via Spring's RestClient builder (search providers) ---
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=15s

# --- Web search ---
# tavily | google | auto (auto = Tavily if TAVILY_API_KEY is set, else Google if its keys are set)
app.search.provider=${SEARCH_PROVIDER:auto}
app.search.max-results=6
tavily.api-key=${TAVILY_API_KEY:}
# Legacy: Google Custom Search is discontinued on 2027-01-01.
google.api.key=${GOOGLE_API_KEY:}
google.cse.id=${GOOGLE_SEARCH_ENGINE:}

# --- Uploads (Google Speech sync API accepts at most 10 MB) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- Supabase Postgres ---
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- CORS ---
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173,http://localhost:3000}

# --- Abuse and cost limits ---
app.input.max-chars=${MAX_INPUT_CHARS:10000}
app.ai.max-content-chars=${MAX_CONTENT_CHARS:20000}
# Reuse a report for the same text/link checked within this many hours (0 disables reuse).
app.reuse.ttl-hours=${REUSE_TTL_HOURS:24}
app.rate-limit.feedback-per-ip-per-minute=${RATE_LIMIT_FEEDBACK_PER_IP_PER_MINUTE:10}
app.rate-limit.per-ip-per-minute=${RATE_LIMIT_PER_IP_PER_MINUTE:5}
app.rate-limit.per-ip-per-day=${RATE_LIMIT_PER_IP_PER_DAY:50}
app.rate-limit.global-per-day=${RATE_LIMIT_GLOBAL_PER_DAY:1000}
# Set to true only when running behind a reverse proxy that appends X-Forwarded-For (e.g. Render).
app.rate-limit.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

# --- URL fetching ---
app.fetch.timeout-millis=10000
app.fetch.max-body-bytes=2000000

# --- History API: exposes all submissions, so off unless explicitly enabled (local dev only) ---
app.history.enabled=${HISTORY_API_ENABLED:false}

# --- OCR ---
tesseract.datapath=${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}

# --- Health check (cheap; no AI or search calls) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Persistence is best-effort, so a database blip must not make the host restart the service.
management.health.db.enabled=false

# --- Logging ---
logging.pattern.level=%5p [%X{requestId:-}]
